plugins {
    id 'com.android.library'
}

android {
    namespace 'com.zijin.plugin.usbcamera'
    packaging {
        resources {
            excludes += ['META-INF/NOTICE', 'META-INF/LICENSE']
        }
    }
}

apply from: rootProject.file('gradle/android-library.gradle')
apply from: rootProject.file('gradle/publish-module.gradle')

dependencies {
    api project(':newland-core')
    // 1.0.5：只右移识别裁剪框，轮廓恢复原位
    api 'com.github.violet000:USBCamera:1.0.5'
}
